name: Validate All Fixtures

on:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  validate-node-fixture:
    uses: ./.github/workflows/secure-ci.yml
    with:
      working_directory: examples/fixtures/node-vulnerable-app
      enable_sast: true
      enable_secrets: true
      gitleaks_exit_code: "0"
      enable_dependencies: true
      trivy_dependency_exit_code: "0"
      enable_container: true
      trivy_container_exit_code: "0"
      enable_iac: false
      container_image_name: secureflow-node-fixture
      container_image_tag: fixture-${{ github.sha }}

  validate-python-fixture:
    uses: ./.github/workflows/secure-ci.yml
    with:
      working_directory: examples/fixtures/python-vulnerable-app
      enable_sast: true
      enable_secrets: true
      gitleaks_exit_code: "0"
      enable_dependencies: true
      trivy_dependency_exit_code: "0"
      enable_container: true
      trivy_container_exit_code: "0"
      enable_iac: false
      container_image_name: secureflow-python-fixture
      container_image_tag: fixture-${{ github.sha }}

  validate-iac-fixture:
    uses: ./.github/workflows/secure-ci.yml
    with:
      working_directory: examples/fixtures/iac-misconfig
      enable_sast: false
      enable_secrets: false
      enable_dependencies: false
      enable_container: false
      enable_iac: true
      iac_scan_path: .
      trivy_iac_exit_code: "0"

  validate-container-labs:
    runs-on: ubuntu-latest
    steps:
      - name: Pull vulnerable lab images
        run: |
          docker pull bkimminich/juice-shop:latest
          docker pull webgoat/webgoat-8.0:latest
          docker pull vulnerables/web-dvwa:latest

      - name: Scan community vulnerable images
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image --severity "CRITICAL,HIGH" bkimminich/juice-shop:latest
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image --severity "CRITICAL,HIGH" webgoat/webgoat-8.0:latest
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image --severity "CRITICAL,HIGH" vulnerables/web-dvwa:latest
