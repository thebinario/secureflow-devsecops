name: Validate Community Container Labs

on:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  validate-container-labs:
    runs-on: ubuntu-latest
    steps:
      - name: Safety notice
        run: |
          echo "These community images are intentionally vulnerable."
          echo "This workflow scans images only and does not deploy or publish them."

      - name: Pull vulnerable lab images
        run: |
          docker pull bkimminich/juice-shop:latest
          docker pull webgoat/webgoat-8.0:latest
          docker pull vulnerables/web-dvwa:latest

      - name: Scan Juice Shop image
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest \
            image \
              --scanners vuln \
              --severity "CRITICAL,HIGH" \
              bkimminich/juice-shop:latest

      - name: Scan WebGoat image
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest \
            image \
              --scanners vuln \
              --severity "CRITICAL,HIGH" \
              webgoat/webgoat-8.0:latest

      - name: Scan DVWA image
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest \
            image \
              --scanners vuln \
              --severity "CRITICAL,HIGH" \
              vulnerables/web-dvwa:latest
