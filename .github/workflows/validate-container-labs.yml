name: Validate Community Container Labs

on:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  validate-container-labs:
    runs-on: ubuntu-latest
    steps:
      - name: Safety notice
        run: |
          echo "These community images are intentionally vulnerable."
          echo "This workflow scans images only and does not deploy or publish them."

      - name: Pull vulnerable lab images
        run: |
          docker pull bkimminich/juice-shop:latest
          docker pull webgoat/webgoat-8.0:latest
          docker pull vulnerables/web-dvwa:latest

      - name: Scan Juice Shop image
        id: juice_shop
        continue-on-error: true
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest \
            image \
              --scanners vuln \
              --severity "CRITICAL,HIGH" \
              --exit-code 1 \
              bkimminich/juice-shop:latest

      - name: Scan WebGoat image
        id: webgoat
        continue-on-error: true
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest \
            image \
              --scanners vuln \
              --severity "CRITICAL,HIGH" \
              --exit-code 1 \
              webgoat/webgoat-8.0:latest

      - name: Scan DVWA image
        id: dvwa
        continue-on-error: true
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest \
            image \
              --scanners vuln \
              --severity "CRITICAL,HIGH" \
              --exit-code 1 \
              vulnerables/web-dvwa:latest

      - name: Fail if vulnerable lab images triggered findings
        if: always()
        run: |
          echo "Juice Shop result: ${{ steps.juice_shop.outcome }}"
          echo "WebGoat result: ${{ steps.webgoat.outcome }}"
          echo "DVWA result: ${{ steps.dvwa.outcome }}"

          failed=0
          for result in "${{ steps.juice_shop.outcome }}" "${{ steps.webgoat.outcome }}" "${{ steps.dvwa.outcome }}"; do
            if [ "$result" = "failure" ]; then
              failed=1
            fi
          done

          if [ "$failed" -eq 1 ]; then
            echo "Security gate blocked the workflow because one or more vulnerable lab images triggered Trivy findings."
            exit 1
          fi
