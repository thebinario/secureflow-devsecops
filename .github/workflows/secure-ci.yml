name: SecureFlow CI

on:
  workflow_call:
    inputs:
      fail_on_severity:
        description: "Minimum severity that should fail the pipeline"
        required: false
        type: string
        default: "critical"

      enable_sast:
        description: "Enable SAST scan"
        required: false
        type: boolean
        default: true

      enable_secrets:
        description: "Enable secrets scanning"
        required: false
        type: boolean
        default: true

      enable_dependencies:
        description: "Enable dependency scanning"
        required: false
        type: boolean
        default: true

      enable_container:
        description: "Enable container scanning when Dockerfile exists"
        required: false
        type: boolean
        default: true

      enable_iac:
        description: "Enable IaC scanning when IaC files exist"
        required: false
        type: boolean
        default: true

      semgrep_config:
        description: "Semgrep rules config"
        required: false
        type: string
        default: "p/owasp-top-ten"

      semgrep_severity:
        description: "Minimum Semgrep severity to fail the scan"
        required: false
        type: string
        default: "ERROR"

      gitleaks_exit_code:
        description: "Exit code when Gitleaks finds secrets"
        required: false
        type: string
        default: "1"

      gitleaks_redact:
        description: "Redact leaked secret values from output"
        required: false
        type: string
        default: "true"

      trivy_dependency_severity:
        description: "Trivy dependency scan severity filter"
        required: false
        type: string
        default: "CRITICAL,HIGH"

      trivy_dependency_ignore_unfixed:
        description: "Ignore vulnerabilities without fixed versions"
        required: false
        type: string
        default: "true"

      trivy_dependency_exit_code:
        description: "Exit code when Trivy finds dependency vulnerabilities"
        required: false
        type: string
        default: "1"

      container_image_name:
        description: "Docker image name used for local container scanning"
        required: false
        type: string
        default: "secureflow-target"

      container_image_tag:
        description: "Docker image tag used for local container scanning"
        required: false
        type: string
        default: "local"

      dockerfile_path:
        description: "Path to Dockerfile"
        required: false
        type: string
        default: "Dockerfile"

      docker_build_context:
        description: "Docker build context"
        required: false
        type: string
        default: "."

      trivy_container_severity:
        description: "Trivy container scan severity filter"
        required: false
        type: string
        default: "CRITICAL,HIGH"

      trivy_container_ignore_unfixed:
        description: "Ignore vulnerabilities without fixed versions"
        required: false
        type: string
        default: "true"

      trivy_container_exit_code:
        description: "Exit code when Trivy finds container vulnerabilities"
        required: false
        type: string
        default: "1"

      iac_scan_path:
        description: "Path to scan for IaC files"
        required: false
        type: string
        default: "."

      trivy_iac_severity:
        description: "Trivy IaC scan severity filter"
        required: false
        type: string
        default: "CRITICAL,HIGH"

      trivy_iac_exit_code:
        description: "Exit code when Trivy finds IaC misconfigurations"
        required: false
        type: string
        default: "1"

    outputs:
      language:
        description: "Detected primary language"
        value: ${{ jobs.detect-stack.outputs.language }}

      package_manager:
        description: "Detected package manager"
        value: ${{ jobs.detect-stack.outputs.package_manager }}

      framework:
        description: "Detected framework"
        value: ${{ jobs.detect-stack.outputs.framework }}

      has_dockerfile:
        description: "Whether the repository has a Dockerfile"
        value: ${{ jobs.detect-stack.outputs.has_dockerfile }}

      has_iac:
        description: "Whether the repository has IaC files"
        value: ${{ jobs.detect-stack.outputs.has_iac }}

      has_tests:
        description: "Whether the repository has tests"
        value: ${{ jobs.detect-stack.outputs.has_tests }}

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  detect-stack:
    name: Detect Stack
    runs-on: ubuntu-latest

    outputs:
      language: ${{ steps.detect.outputs.language }}
      package_manager: ${{ steps.detect.outputs.package_manager }}
      framework: ${{ steps.detect.outputs.framework }}
      has_dockerfile: ${{ steps.detect.outputs.has_dockerfile }}
      has_iac: ${{ steps.detect.outputs.has_iac }}
      has_tests: ${{ steps.detect.outputs.has_tests }}

    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4

      - name: Detect project stack
        id: detect
        uses: thebinario/secureflow-devsecops/actions/detect-stack@master

      - name: Print detected stack
        shell: bash
        run: |
          echo "Language: ${{ steps.detect.outputs.language }}"
          echo "Package manager: ${{ steps.detect.outputs.package_manager }}"
          echo "Framework: ${{ steps.detect.outputs.framework }}"
          echo "Has Dockerfile: ${{ steps.detect.outputs.has_dockerfile }}"
          echo "Has IaC: ${{ steps.detect.outputs.has_iac }}"
          echo "Has tests: ${{ steps.detect.outputs.has_tests }}"

  security-plan:
    name: Security Plan
    runs-on: ubuntu-latest
    needs: detect-stack

    steps:
      - name: Generate security plan
        shell: bash
        run: |
          echo "SecureFlow security plan"
          echo "------------------------"
          echo "Detected language: ${{ needs.detect-stack.outputs.language }}"
          echo "Detected package manager: ${{ needs.detect-stack.outputs.package_manager }}"
          echo "Detected framework: ${{ needs.detect-stack.outputs.framework }}"
          echo "Fail on severity: ${{ inputs.fail_on_severity }}"
          echo ""
          echo "Enabled checks:"
          echo "SAST: ${{ inputs.enable_sast }}"
          echo "Secrets: ${{ inputs.enable_secrets }}"
          echo "Dependencies: ${{ inputs.enable_dependencies }}"
          echo "Container: ${{ inputs.enable_container }}"
          echo "IaC: ${{ inputs.enable_iac }}"
          echo ""
          echo "Conditional checks:"
          echo "Container scan will run: ${{ inputs.enable_container && needs.detect-stack.outputs.has_dockerfile == 'true' }}"
          echo "IaC scan will run: ${{ inputs.enable_iac && needs.detect-stack.outputs.has_iac == 'true' }}"

  sast:
    name: SAST
    runs-on: ubuntu-latest
    needs: detect-stack
    if: ${{ inputs.enable_sast }}

    permissions:
      contents: read
      security-events: write

    outputs:
      result: ${{ steps.status.outputs.result }}

    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4

      - name: Run SAST with Semgrep
        id: sast
        uses: thebinario/secureflow-devsecops/actions/run-sast@master
        with:
          config: ${{ inputs.semgrep_config }}
          severity: ${{ inputs.semgrep_severity }}
          generate_sarif: "true"
          sarif_output: "semgrep-results.sarif"

      - name: Upload Semgrep SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep-sast

      - name: Set SAST status
        id: status
        if: always()
        shell: bash
        run: |
          echo "result=${{ job.status }}" >> "$GITHUB_OUTPUT"

  secrets:
    name: Secrets Scan
    runs-on: ubuntu-latest
    needs: detect-stack
    if: ${{ inputs.enable_secrets }}

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run secrets scan with Gitleaks
        id: secrets
        uses: thebinario/secureflow-devsecops/actions/run-secrets-scan@master
        with:
          report_format: "sarif"
          report_path: "gitleaks-results.sarif"
          redact: ${{ inputs.gitleaks_redact }}
          exit_code: ${{ inputs.gitleaks_exit_code }}

      - name: Upload Gitleaks SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks-results.sarif

  dependency-scan:
    name: Dependency Scan
    runs-on: ubuntu-latest
    needs: detect-stack
    if: ${{ inputs.enable_dependencies }}

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4

      - name: Run dependency scan with Trivy
        id: dependency-scan
        uses: thebinario/secureflow-devsecops/actions/run-dependency-scan@master
        with:
          severity: ${{ inputs.trivy_dependency_severity }}
          ignore_unfixed: ${{ inputs.trivy_dependency_ignore_unfixed }}
          exit_code: ${{ inputs.trivy_dependency_exit_code }}
          report_format: "sarif"
          report_path: "trivy-dependency-results.sarif"

      - name: Upload Trivy dependency SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-dependency-results.sarif
          category: trivy-dependency

  container-scan:
    name: Container Scan
    runs-on: ubuntu-latest
    needs: detect-stack
    if: ${{ inputs.enable_container && needs.detect-stack.outputs.has_dockerfile == 'true' }}

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4

      - name: Run container scan with Trivy
        id: container-scan
        uses: thebinario/secureflow-devsecops/actions/run-container-scan@master
        with:
          image_name: ${{ inputs.container_image_name }}
          image_tag: ${{ inputs.container_image_tag }}
          dockerfile: ${{ inputs.dockerfile_path }}
          context: ${{ inputs.docker_build_context }}
          severity: ${{ inputs.trivy_container_severity }}
          ignore_unfixed: ${{ inputs.trivy_container_ignore_unfixed }}
          exit_code: ${{ inputs.trivy_container_exit_code }}
          report_format: "sarif"
          report_path: "trivy-container-results.sarif"

      - name: Upload Trivy container SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-container-results.sarif
          category: trivy-container

  iac-scan:
    name: IaC Scan
    runs-on: ubuntu-latest
    needs: detect-stack
    if: ${{ inputs.enable_iac && needs.detect-stack.outputs.has_iac == 'true' }}

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4

      - name: Run IaC scan with Trivy
        id: iac-scan
        uses: thebinario/secureflow-devsecops/actions/run-iac-scan@master
        with:
          scan_path: ${{ inputs.iac_scan_path }}
          severity: ${{ inputs.trivy_iac_severity }}
          exit_code: ${{ inputs.trivy_iac_exit_code }}
          report_format: "sarif"
          report_path: "trivy-iac-results.sarif"

      - name: Upload Trivy IaC SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-iac-results.sarif
          category: trivy-iac
  security-status:
    name: Security Status
    runs-on: ubuntu-latest
    needs:
      - detect-stack
      - sast
      - secrets
      - dependency-scan
      - container-scan
      - iac-scan
    if: always()

    permissions:
      contents: read

    outputs:
      sast_result: ${{ steps.status.outputs.sast_result }}
      secrets_result: ${{ steps.status.outputs.secrets_result }}
      dependency_result: ${{ steps.status.outputs.dependency_result }}
      container_result: ${{ steps.status.outputs.container_result }}
      iac_result: ${{ steps.status.outputs.iac_result }}

    steps:
      - name: Collect security job status
        id: status
        shell: bash
        run: |
          echo "sast_result=${{ needs.sast.result }}" >> "$GITHUB_OUTPUT"
          echo "secrets_result=${{ needs.secrets.result }}" >> "$GITHUB_OUTPUT"
          echo "dependency_result=${{ needs.dependency-scan.result }}" >> "$GITHUB_OUTPUT"
          echo "container_result=${{ needs.container-scan.result }}" >> "$GITHUB_OUTPUT"
          echo "iac_result=${{ needs.iac-scan.result }}" >> "$GITHUB_OUTPUT"

          echo "SAST: ${{ needs.sast.result }}"
          echo "Secrets: ${{ needs.secrets.result }}"
          echo "Dependencies: ${{ needs.dependency-scan.result }}"
          echo "Container: ${{ needs.container-scan.result }}"
          echo "IaC: ${{ needs.iac-scan.result }}"

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs:
    - detect-stack
    - security-status
    if: always()

    permissions:
      contents: read

    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4

      - name: Generate SecureFlow security summary
        uses: thebinario/secureflow-devsecops/actions/security-summary@master
        with:
          language: ${{ needs.detect-stack.outputs.language }}
          package_manager: ${{ needs.detect-stack.outputs.package_manager }}
          framework: ${{ needs.detect-stack.outputs.framework }}
          has_dockerfile: ${{ needs.detect-stack.outputs.has_dockerfile }}
          has_iac: ${{ needs.detect-stack.outputs.has_iac }}
          has_tests: ${{ needs.detect-stack.outputs.has_tests }}
          enable_sast: ${{ inputs.enable_sast }}
          enable_secrets: ${{ inputs.enable_secrets }}
          enable_dependencies: ${{ inputs.enable_dependencies }}
          enable_container: ${{ inputs.enable_container }}
          enable_iac: ${{ inputs.enable_iac }}
          fail_on_severity: ${{ inputs.fail_on_severity }}
          sast_result: ${{ needs.security-status.outputs.sast_result }}
          secrets_result: ${{ needs.security-status.outputs.secrets_result }}
          dependency_result: ${{ needs.security-status.outputs.dependency_result }}
          container_result: ${{ needs.security-status.outputs.container_result }}
          iac_result: ${{ needs.security-status.outputs.iac_result }}