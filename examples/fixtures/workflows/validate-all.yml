name: Validate All Fixtures

on:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  validate-node-fixture:
    uses: thebinario/secureflow-devsecops/.github/workflows/secure-ci.yml@master
    with:
      working_directory: examples/fixtures/node-vulnerable-app
      enable_sast: true
      enable_secrets: true
      enable_dependencies: true
      enable_container: true
      enable_iac: false
      container_image_name: secureflow-node-fixture
      container_image_tag: fixture-${{ github.sha }}

  validate-python-fixture:
    uses: thebinario/secureflow-devsecops/.github/workflows/secure-ci.yml@master
    with:
      working_directory: examples/fixtures/python-vulnerable-app
      enable_sast: true
      enable_secrets: true
      enable_dependencies: true
      enable_container: true
      enable_iac: false
      container_image_name: secureflow-python-fixture
      container_image_tag: fixture-${{ github.sha }}

  validate-iac-fixture:
    uses: thebinario/secureflow-devsecops/.github/workflows/secure-ci.yml@master
    with:
      working_directory: examples/fixtures/iac-misconfig
      enable_sast: false
      enable_secrets: false
      enable_dependencies: false
      enable_container: false
      enable_iac: true
      iac_scan_path: .

  validate-container-labs:
    runs-on: ubuntu-latest
    steps:
      - name: Pull vulnerable lab images
        run: |
          docker pull bkimminich/juice-shop:latest
          docker pull webgoat/webgoat-8.0:latest
          docker pull vulnerables/web-dvwa:latest

      - name: Scan Juice Shop image
        id: juice_shop
        continue-on-error: true
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image --severity "CRITICAL,HIGH" --exit-code 1 bkimminich/juice-shop:latest

      - name: Scan WebGoat image
        id: webgoat
        continue-on-error: true
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image --severity "CRITICAL,HIGH" --exit-code 1 webgoat/webgoat-8.0:latest

      - name: Scan DVWA image
        id: dvwa
        continue-on-error: true
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image --severity "CRITICAL,HIGH" --exit-code 1 vulnerables/web-dvwa:latest

      - name: Fail if vulnerable lab images triggered findings
        if: always()
        run: |
          echo "Juice Shop result: ${{ steps.juice_shop.outcome }}"
          echo "WebGoat result: ${{ steps.webgoat.outcome }}"
          echo "DVWA result: ${{ steps.dvwa.outcome }}"

          failed=0
          for result in "${{ steps.juice_shop.outcome }}" "${{ steps.webgoat.outcome }}" "${{ steps.dvwa.outcome }}"; do
            if [ "$result" = "failure" ]; then
              failed=1
            fi
          done

          if [ "$failed" -eq 1 ]; then
            echo "Security gate blocked the workflow because one or more vulnerable lab images triggered Trivy findings."
            exit 1
          fi
