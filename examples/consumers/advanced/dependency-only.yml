name: SecureFlow CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  secureflow:
    uses: thebinario/secureflow-devsecops/.github/workflows/secure-ci.yml@master
    with:
      enable_sast: false
      enable_secrets: false
      enable_dependencies: true
      enable_container: false
      enable_iac: false
