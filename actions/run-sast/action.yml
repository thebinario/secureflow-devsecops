name: "Run SAST"
description: "Runs Semgrep SAST scan and generates SARIF results"

inputs:
  working_directory:
    description: "Repository subdirectory to scan"
    required: false
    default: "."

  config:
    description: "Semgrep rules config"
    required: false
    default: "p/owasp-top-ten"

  severity:
    description: "Minimum severity to fail the scan"
    required: false
    default: "ERROR"

  generate_sarif:
    description: "Generate SARIF report"
    required: false
    default: "true"

  sarif_output:
    description: "SARIF output path"
    required: false
    default: "semgrep-results.sarif"

outputs:
  sarif_file:
    description: "Generated SARIF file path"
    value: ${{ steps.semgrep.outputs.sarif_file }}

runs:
  using: "composite"
  steps:
    - name: Run Semgrep SAST
      id: semgrep
      shell: bash
      run: |
        set -euo pipefail

        WORKDIR="${{ inputs.working_directory }}"
        TARGET_DIR="$PWD"
        REPORT_FILE="${{ inputs.sarif_output }}"

        if [ "$WORKDIR" != "." ]; then
          TARGET_DIR="$PWD/$WORKDIR"
          REPORT_FILE="$WORKDIR/${{ inputs.sarif_output }}"
        fi

        echo "Running Semgrep SAST..."
        echo "Working directory: ${WORKDIR}"
        echo "Config: ${{ inputs.config }}"
        echo "Severity gate: ${{ inputs.severity }}"

        cd "$TARGET_DIR"

        docker run --rm \
          -v "${TARGET_DIR}:/src" \
          -w /src \
          semgrep/semgrep:latest \
          semgrep scan \
            --config="${{ inputs.config }}" \
            --severity="${{ inputs.severity }}" \
            --sarif \
            --output="${{ inputs.sarif_output }}"

        echo "sarif_file=${REPORT_FILE}" >> "$GITHUB_OUTPUT"
